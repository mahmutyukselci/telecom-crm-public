# config-repo/subscription-service.yml
server:
  port: 8082

spring:
  application:
    name: subscription-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/telecom-realm
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: subscription_schema
        hbm2ddl.create_namespaces: true
  flyway:
    enabled: true
    schemas: subscription_schema
    default-schema: subscription_schema
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
