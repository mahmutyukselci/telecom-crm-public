# config-repo/application.yml
spring:
  # Common Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/telecom_db
    username: telecom_user
    password: telecom_password
    driver-class-name: org.postgresql.Driver

  # Common Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # CRITICAL SHIELD: Use ErrorHandlingDeserializer to prevent poison pill infinite loops
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Delegate the actual deserialization to JsonDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Trust all packages for incoming JSON mapping
        spring.json.trusted.packages: "*"

  # Common Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

# Common Service Discovery (Eureka)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Common Observability Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus  # Enables the Prometheus endpoint

  prometheus:
    metrics:
      export:
        enabled: true  # Exposes metrics in Prometheus format

  # Official OpenTelemetry configuration for Spring Boot 4
  opentelemetry:
    tracing:
      enabled: true
      export:
        otlp:
          # Tempo HTTP endpoint (full URL required for Spring Boot 4)
          endpoint: http://localhost:4318/v1/traces
      sampling:
        probability: 1.0  # Captures all traces (can be reduced in production)

  # Disable OTLP metrics export
  otlp:
    metrics:
      export:
        enabled: false  # Disables pushing metrics via OTLP (fixes 404 error)
# Add Application Name, Trace ID, and Span ID to log output
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  config: file:./config-repo/logback-spring.xml
  include-application-name: false