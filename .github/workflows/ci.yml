name: Telecom CRM Enterprise CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for Docker (Testcontainers)
        run: |
          for i in {1..10}; do
            docker info && break
            sleep 3
          done

      - name: Build and Run Tests via Parent POM
        run: mvn clean install -B --no-transfer-progress

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
