server:
  port: 8082

spring:
  application:
    name: subscription-service

  config:
    import: "classpath:application-shared.yml"

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/telecom_db}
    username: ${POSTGRES_USER:telecom_user}
    password: ${POSTGRES_PASSWORD:telecom_password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: subscription_schema
        hbm2ddl.create_namespaces: true

  flyway:
    enabled: true
    schemas: subscription_schema
    default-schema: subscription_schema
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

subscription:
  expiry:
    days-ahead: 3