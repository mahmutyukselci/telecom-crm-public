global:
  scrape_interval: 5s 

scrape_configs:
  - job_name: 'telecom-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: 
        - 'host.docker.internal:8080' 
        - 'host.docker.internal:8082' 
        - 'host.docker.internal:8083' 
        - 'host.docker.internal:8084' 
        - 'host.docker.internal:8085' 


  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']